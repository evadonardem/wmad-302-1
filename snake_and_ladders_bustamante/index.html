<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Snakes and Ladders (Bustamante)</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

    <!-- Game Script -->
    <script src="scripts/snakes_and_ladders.js" defer></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        h1, h5, label {
            color: maroon;
            font-weight: bold;
        }

        .navbar {
            background-color: maroon !important;
        }

        #boardPlaceholder {
            background-image: url('images/board.jpg');
            background-size: cover;
            position: relative;
            width: 740px;
            height: 740px;
            border: 4px solid maroon;
            border-radius: 10px;
            box-shadow: 0 0 15px maroon;
        }

        /* canvas sits on top of the board image */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            background-color: transparent;
            z-index: 2;
        }

        .btn-maroon {
            background-color: maroon;
            border: none;
        }

        .btn-maroon:hover {
            background-color: #8b0000;
        }

        #currentTurn {
            text-align: center;
            background-color: maroon;
            color: white;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #dicePlaceholder i {
            font-size: 60px;
            color: maroon;
        }

        #rolledValue {
            font-size: 18px;
            font-weight: bold;
            color: maroon;
        }

        /* Player color list */
        #playerColorList {
            margin-top: 15px;
            font-weight: bold;
            color: maroon;
        }

        #winnerDisplay {
            background-color: maroon;
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="#">
                <i class="fa fa-xl fa-gamepad"></i>
                Snakes and Ladders - Bustamante
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Board -->
            <div class="col-md-8">
                <h1>Board</h1>
                <div id="boardPlaceholder">
                    <canvas id="gameCanvas" width="740" height="740"></canvas>
                </div>
            </div>

            <!-- Game Settings -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Game Settings</h5>

                        <div class="mb-3">
                            <label for="playerCount" class="form-label">Number of Players</label>
                            <select id="playerCount" class="form-select">
                                <option value="2">2 Players</option>
                                <option value="3">3 Players</option>
                                <option value="4">4 Players</option>
                            </select>
                        </div>

                        <button id="startGameBtn" class="btn btn-maroon w-100 mb-3" style="color: white;">Start Game</button>

                        <hr>

                        <div id="currentTurn">Waiting to start...</div>

                        <div class="text-center">
                            <div id="dicePlaceholder" class="my-2">
                                <i class="fa fa-dice-one"></i>
                            </div>
                            <div id="rolledValue">Roll to start!</div>
                            <button id="rollDiceButton" class="btn btn-maroon w-100 mt-3" style="color: white;">Roll Dice</button>
                        </div>

                        <!-- Player Color List -->
                        <div id="playerColorList"></div>

                        <!-- Winner Display -->
                        <div id="winnerDisplay"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
