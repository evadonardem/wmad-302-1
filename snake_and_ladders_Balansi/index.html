<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders (Balansi, Rhys Alecksie)</title>

    <!-- Load Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Load FontAwesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Load Snake and Ladders Game Funcationality -->
     <script src="scripts/snakes_and_ladders.js" defer></script>

     <style>
        
        html, body {
            background: #f7f8fa;
            color: #222;
            font-family: 'SF Pro Display', 'Inter', 'Segoe UI', Arial, sans-serif;
            font-size: 18px;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .navbar {
            background: #fff !important;
            border-bottom: 1px solid #e5e7eb !important;
            box-shadow: 0 2px 8px 0 rgba(0,0,0,0.03);
        }
        .navbar-brand, .navbar-toggler {
            color: #222 !important;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        h1, h5, .card-title {
            font-weight: 600;
            color: #222;
            letter-spacing: 0.01em;
        }
        .container {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.04);
            padding: 32px 24px;
            margin-top: 32px;
        }
        .card {
            border-radius: 22px;
            border: none;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.04);
            background: rgba(247,248,250,0.95);
            backdrop-filter: blur(2px);
            padding-bottom: 18px;
        }
        #rollDiceButton, #restartButton {
            background: linear-gradient(90deg, #e0e7ef 0%, #f7fafc 100%);
            color: #222;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 12px 32px;
            box-shadow: 0 2px 8px 0 rgba(76,195,247,0.08);
            transition: background 0.2s, box-shadow 0.2s, color 0.2s;
            margin-bottom: 8px;
        }
        #rollDiceButton:hover, #rollDiceButton:focus,
        #restartButton:hover, #restartButton:focus {
            background: linear-gradient(90deg, #d1eaff 0%, #e0f7fa 100%);
            color: #007aff;
            box-shadow: 0 4px 16px 0 rgba(76,195,247,0.15);
        }
        #dicePlaceholder {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            box-shadow: 0 1px 4px 0 rgba(33,150,243,0.04);
        }
        .player-score {
            background: linear-gradient(90deg, #f1f5f9 0%, #e3eafc 100%);
            border-radius: 14px;
            padding: 10px 18px;
            margin-bottom: 10px;
            font-weight: 500;
            color: #222;
            box-shadow: 0 1px 4px 0 rgba(33,150,243,0.07);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
        }
        .player-score b {
            color: #fff;
            font-weight: 700;
            margin-left: 6px;
        }
        
        #boardPlaceholder {
            background-image: url('images/board.jpg');
            background-size: cover;
            position: relative;
            width: 740px;
            height: 740px;
        }
    </style>
</head>
<body>
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa fa-xl fa-gamepad"></i>
                Snake and Ladders Game by Balansi, Rhys Alecksie
            </a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-9">
                <h1>Board</h1>
                <div id="boardPlaceholder">
                    <canvas width="740" height="740"></canvas>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card" style="width: 18rem;">
                    <div class="card-body">
                        <h5 class="card-title">Roll the Dice!</h5>
                        <div id="dicePlaceholder"></div>
                        <hr>
                        <button id="rollDiceButton" class="btn btn-primary">Roll Dice</button>
                        <button id="restartButton" class="btn btn-secondary mt-2" style="display:none;">Restart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
