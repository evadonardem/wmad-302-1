<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders Fernandez, Ronie</title>

    <!-- Load Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Load FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Load Game Logic -->
    <script src="scripts/snakes_and_ladders.js" defer></script>

    <!-- Load Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="#">
                <i class="fa fa-xl fa-gamepad"></i>
                Snakes and Ladders - Fernandez
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Game Board -->
            <div class="col-md-8">
                <h1>Game Board</h1>
                <div id="boardPlaceholder">
                    <canvas id="gameCanvas" width="740" height="740"></canvas>
                </div>
            </div>

            <!-- Game Panel -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Game Controls</h5>

                        <div class="mb-3">
                            <label for="playerCount" class="form-label">Number of Players</label>
                            <select id="playerCount" class="form-select">
                                <option value="2">2 Players</option>
                                <option value="3">3 Players</option>
                                <option value="4">4 Players</option>
                            </select>
                        </div>

                        <button id="startGameBtn" class="btn btn w-100 mb-3">Start Game</button>

                        <div id="gamePanel" style="display: none;">
                            <hr>

                            <div id="currentTurn">Waiting to start...</div>

                            <div class="text-center">
                                <div id="dicePlaceholder" class="my-2">
                                    <i class="fa fa-dice-one"></i>
                                </div>
                                <div id="rolledValue">Roll to start!</div>
                                <button id="rollDiceButton" class="btn btn-maroon w-100 mt-3">Roll Dice</button>
                            </div>

                            <div id="playerColorList"></div>
                            <div id="winnerDisplay"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti Script -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>

</html>
