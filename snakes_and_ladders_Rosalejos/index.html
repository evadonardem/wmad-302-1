<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders (Rosalejos, Sean Earl)</title>

    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

     <script src="scripts/snakes_and_ladders.js" defer></script>

     <style>
        body {
        background-image: url(./images/background.gif);
        background-size: cover;
        background-attachment: fixed;
        font-family: "Press Start 2P", system-ui;
        }
        h1 {
            color: rgb(0, 10, 19);
        }
        
        #boardPlaceholder {
            background-image: url('images/board.jpg');
            background-size: cover;
            position: relative;
            width: 740px;
            height: 740px;
        }

        #eventLog::-webkit-scrollbar {
            width: 6px;
        }
        #eventLog::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.3);
            border-radius: 10px;
        }
        #eventLog::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa fa-xl fa-gamepad"></i>
                Snake and Ladders Game by Rosalejos, Sean Earl
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-9">
                <h1>Board</h1>
                <div id="boardPlaceholder">
                    <canvas width="740" height="740"></canvas>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card" style="width: 18rem; background-color: rgba(50, 50, 50, 0.7); color: white; border: none;">
                    <div class="card-body">
                        <h5 class="card-title">Roll the Dice!</h5>
                        <div id="dicePlaceholder"></div>
                        <hr>
                        <button id="rollDiceButton" class="btn btn-primary">Roll Dice</button>
                        <hr>
                        <h6>POSITION:</h6>
                        <ul id="playerPositions" style="font-size: 10px; list-style: none; padding-left: 0;"></ul>
                        <hr>
                        <h6>EVENTS:</h6>
                        <div id="eventLog" 
                            style="font-size: 10px; 
                                    height: 250px; 
                                    max-height: 250px; 
                                    overflow-y: auto; 
                                    background-color: rgba(0, 0, 0, 0.4); 
                                    border-radius: 5px; 
                                    padding: 6px; 
                                    color: white; 
                                    line-height: 1.5; 
                                    border: 1px solid rgba(255,255,255,0.1); 
                                    box-shadow: inset 0 0 5px rgba(255,255,255,0.1);">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
