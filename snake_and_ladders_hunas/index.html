<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snakes and Ladders (Hunas, Charnel Jho)</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Game Script -->
  <script src="scripts/snakes_and_ladders.js" defer></script>

  <style>
    body {
      background: linear-gradient(135deg, #e0ffcd, #fdffcd, #ffebbb, #ffcab0);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      font-family: "Poppins", sans-serif;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .navbar {
      background: rgba(0, 0, 0, 0.7) !important;
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255,255,255,0.15);
    }

    .navbar-brand i {
      color: #ffcc70;
      margin-right: 8px;
    }

    #boardPlaceholder {
      background-image: url('images/board.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      width: 740px;
      height: 740px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    #boardPlaceholder:hover {
      transform: scale(1.01);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    canvas {
      border-radius: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      border-radius: 15px;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-title {
      text-align: center;
      font-weight: 600;
      color: #333;
    }

    #dicePlaceholder {
      text-align: center;
      font-size: 50px;
      margin: 20px 0;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #rollDiceButton {
      width: 100%;
      font-weight: 600;
      background: linear-gradient(135deg, #56ccf2, #2f80ed);
      border: none;
      transition: all 0.3s ease;
    }

    #rollDiceButton:hover {
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      transform: scale(1.05);
    }

    footer {
      background: rgba(0, 0, 0, 0.8);
      color: #eee;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .container {
      padding-bottom: 40px;
    }

    #turnInfo {
      color: #2f80ed;
      text-align: center;
    }

    #statusPanel {
      color: #444;
      text-align: center;
    }

    a.nav-link:hover {
      text-decoration: underline;
      color: #ffcc70 !important;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <i class="fa fa-gamepad"></i> Snake and Ladders
    </a>
    <ul class="navbar-nav ms-auto d-flex flex-row">
      <li class="nav-item me-3">
        <a class="nav-link text-light" href="#" id="playAgain">Play Again</a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link text-light" href="#" id="restartGame">Restart Game</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-light" href="#" id="exitGame">Exit</a>
      </li>
    </ul>
  </div>
</nav>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-9">
      <h1 class="fw-bold mb-3 text-center">🎲 Game Board</h1>
      <div id="boardPlaceholder">
        <canvas width="740" height="740"></canvas>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card mx-auto" style="width: 18rem;">
        <div class="card-body">
          <h5 class="card-title">Roll the Dice!</h5>
          <div id="dicePlaceholder"></div>
          <hr>
          <button id="rollDiceButton" class="btn btn-primary">Roll Dice</button>
          <hr>
          <div id="turnInfo" class="mt-2 fw-bold"></div>
          <div id="statusPanel" class="mt-2"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3 mt-4">
  &copy; 2025 Snake and Ladders Game by <strong>Freddie Visaya</strong>
</footer>

<script>
document.getElementById('playAgain').addEventListener('click', () => {
  players.forEach(p => p.position = 0);
  currentPlayerIndex = 0;
  drawPlayers();
  updateUI("Game restarted!");
  diceElement.innerHTML = dice.getIcon();
  rollDiceButton.disabled = false;
});

document.getElementById('restartGame').addEventListener('click', () => {
  gameStarted = false;
  initializeGame();
});

document.getElementById('exitGame').addEventListener('click', () => {
  if (confirm("Are you sure you want to exit?")) {
    window.location.href = "about:blank";
  }
});
</script>

</body>
</html>
