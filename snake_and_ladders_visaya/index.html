<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders (Visaya, Freddie)</title>

    <!-- Load Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Load FontAwesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Load Snake and Ladders Game Funcationality -->
    <script src="scripts/snakes_and_ladders.js" defer></script>

    <style>
        body {
            background: linear-gradient(to bottom right, #d4fc79, #96e6a1);
        }
        #boardPlaceholder {
            background-image: url('images/board.jpg');
            background-size: cover;
            position: relative;
            width: 740px;
            height: 740px;
        }
        .container {
        padding-bottom: 40px;
}
    </style>
</head>
<body>
<nav class="navbar bg-dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand text-light" href="#">
      <i class="fa fa-gamepad"></i> Snake and Ladders
    </a>
    <ul class="navbar-nav ms-auto d-flex flex-row">
      <li class="nav-item me-3">
        <a class="nav-link text-light" href="#" id="playAgain">Play Again</a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link text-light" href="#" id="restartGame">Restart Game</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-light" href="#" id="exitGame">Exit</a>
      </li>
    </ul>
  </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-9">
            <h1>Board</h1>
            <div id="boardPlaceholder">
                <canvas width="740" height="740"></canvas>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Roll the Dice!</h5>
                    <div id="dicePlaceholder"></div>
                    <hr>
                    <button id="rollDiceButton" class="btn btn-primary">Roll Dice</button>
                    <hr>
                    <div id="turnInfo" class="mt-2 fw-bold"></div>
                    <div id="statusPanel" class="mt-2"></div>
                </div>
            </div>
        </div>
    </div>
</div>
    <footer class="bg-dark text-light text-center py-3 mt-4">
    &copy; 2025 Snake and Ladders Game by Freddie Visaya
    </footer>
<script>
document.getElementById('playAgain').addEventListener('click', () => {
    players.forEach(p => p.position = 0);
    currentPlayerIndex = 0;
    drawPlayers();
    updateUI("Game restarted!");
    diceElement.innerHTML = dice.getIcon();
    rollDiceButton.disabled = false;
});

document.getElementById('restartGame').addEventListener('click', () => {
    gameStarted = false;
    initializeGame();
});

document.getElementById('exitGame').addEventListener('click', () => {
    if(confirm("Are you sure you want to exit?")) {
        window.location.href = "about:blank";
    }
});
</script>
</body>
</html>
