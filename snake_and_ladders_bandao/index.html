<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders (Bandao, Jsa)</title>

    <!-- Load Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Load FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
    body {
        background: linear-gradient(270deg, #f9d976, #f39f86, #a1c4fd, #c2e9fb);
        background-size: 800% 800%;
        animation: gradientShift 15s ease infinite;
        min-height: 100vh;
        margin: 0;
        padding: 0;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    #boardPlaceholder {
        background-image: url('images/board.jpg');
        background-size: cover;
        position: relative;
        width: 740px;
        height: 740px;
    }

    .active-player {
        font-weight: bold;
        background-color: #d1ecf1 !important;
        border-left: 5px solid #0d6efd;
    }
</style>

</head>
<body>
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa fa-xl fa-gamepad"></i>
                Snake and Ladders Game by Bandao, Jsa
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-9">
                <h1>Board</h1>
                <div id="boardPlaceholder">
                    <canvas width="740" height="740"></canvas>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card" style="width: 18rem;">
                    <div class="card-body">
                        <h5 class="card-title">Players</h5>
                        <form id="playerForm">
                            <input type="text" class="form-control mb-2" id="playerName" placeholder="Enter player name">
                            <button type="submit" class="btn btn-success w-100 mb-2">Add Player</button>
                        </form>
                        <ul id="playerList" class="list-group mb-3"></ul>
                        
                        <h5 class="card-title">Roll the Dice!</h5>
                        <div id="dicePlaceholder"></div>
                        <hr>
                        <button id="rollDiceButton" class="btn btn-primary w-100 mb-2" disabled>Roll Dice</button>
                        <button id="restartButton" class="btn btn-danger w-100">Restart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link JS -->
    <script src="scripts/snakes_and_ladders.js" defer></script>
</body>
</html>
