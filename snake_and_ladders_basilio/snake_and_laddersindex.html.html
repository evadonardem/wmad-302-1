<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snakes and Ladders (Basilio, Clint Kycer)</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- FontAwesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  />

  <!-- Game Script -->
  <script src="scripts/game.js" defer></script>

  <style>
    #boardPlaceholder {
      position: relative;
      width: 740px;
      height: 740px;
      border: 2px solid #333;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <nav class="navbar bg-dark text-white">
    <div class="container-fluid">
      <a class="navbar-brand text-white" href="#">
        <i class="fa fa-xl fa-gamepad"></i>
        Snakes and Ladders Game by Basilio, Clint Kycer
      </a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-9">
        <h1>Board</h1>
        <div id="boardPlaceholder">
          <canvas id="gameCanvas" width="740" height="740"></canvas>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Roll the Dice!</h5>
            <div id="dicePlaceholder" class="mb-3 text-center display-5"></div>
            <button id="rollDiceButton" class="btn btn-primary w-100">Roll Dice</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
