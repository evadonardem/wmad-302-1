<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders (Tomin, Miller)</title>

    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        crossorigin="anonymous"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        crossorigin="anonymous"></script>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="scripts/snakes_and_ladders.js" defer></script>

    <style>
        #boardPlaceholder {
            background-image: url('images/board.jpg');
            background-size: cover;
            position: relative;
            width: 740px;
            height: 740px;
            border: 3px solid #333;
        }

        #dicePlaceholder {
            text-align: center;
            font-size: 2rem;
        }

        #playerList {
            font-size: 0.9rem;
        }

        #turnInfo {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }

        #statusPanel {
            margin-top: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa fa-xl fa-gamepad"></i>
                Snakes and Ladders Game (Tomin, Miller)
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            
            <div class="col-md-9">
                <h3>Board</h3>
                <div id="boardPlaceholder">
                    <canvas width="740" height="740"></canvas>
                </div>
            </div>

       
            <div class="col-md-3">
                
                <div class="card mb-3">
                    <div class="card-body text-center">
                        <h5 class="card-title">Roll the Dice!</h5>
                        <div id="dicePlaceholder"></div>
                        <hr>
                        <button id="rollDiceButton" class="btn btn-primary w-100">Roll Dice</button>
                        <div id="turnInfo"></div>
                        <div id="statusPanel"></div>
                    </div>
                </div>

                
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Game Setup</h5>
                        <div id="playerList"></div>
                        <button id="addPlayerButton" class="btn btn-success btn-sm mt-2 w-100">Add Player</button>
                        <button id="startGameButton" class="btn btn-primary btn-sm mt-2 w-100">Start Game</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
