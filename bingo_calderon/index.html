<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My BINGO Game (Calderon, Lorenz)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
        integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"
        integrity="sha512-WFN04846sdKMIP5LKNphMaWzU7YpMyCU245etK3g/2ARYbPK9Ub18eG+ljU96qKRCWh+quCY7yefSmlkQw1ANQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

        
    <style>
        body {
            background: #2D4059;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        h1{
            text-shadow: 2px, 2px, #FFD460;
        }

        #title{
            font-family: fantasy;
            font-size: 690%;
            color: #f54343;
            text-align: center;
        }

        .container {
            margin-top: 20px;
        }

        table {
            border-radius: 16px;
            border: 2px;
            border-color: #EA5455;
            overflow: hidden;
        }

        table thead th {
            font-size: 18px;
            text-align: center;
        }

        table td {
            width: 60px;
            height: 60px;
            font-size: 18px;
            vertical-align: middle;
            text-align: center;
        }

        .table-success td {
            font-weight: bold;
            color: #cf0000;
            background-color: #FFD460;

        }

        .badge {
            font-size: 14px;
            padding: 10px;
            min-width: 45px;
            line-height: 1.2;
        }

        #drawnBallsPlaceholder {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        #numberOfCards {
            font-size: 18px;
            text-align: center;
        }

        .btn-group .btn {
            font-size: 18px;
            padding: 10px 20px;
        }

        .card-header {
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <br />
    <h1 class="shadow-lg p-3 mb-5 rounded" id = "title">B &nbsp; I &nbsp; N &nbsp; G &nbsp; O  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;G &nbsp; A &nbsp; M &nbsp; E &nbsp;</h1>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="form-floating mt-3 mb-3">
                    <input type="number" class="form-control" id="numberOfCards">
                    <label for="numberOfCards"><b>Number of Cards</b></label>
                </div>
                <div id="cardsPlaceholder">
                    <!-- Bingo Cards Placeholder -->
                </div>
            </div>
            <div class="col-md-4">
                <div class="btn-group form-control mt-3 mb-3" role="group">
                    <button type="button" class="btn btn-warning" id="roll">Roll</button>
                    <button type="button" class="btn btn-danger" id="draw">Draw</button>
                </div>
                <div class="card mb-3">
                    <div class="card-header">
                        Drawn Balls
                    </div>
                    <div class="card-body">
                        <div id="drawnBallsPlaceholder"></div>  
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        Lucky Cards
                    </div>
                    <div class="card-body">
                        <div id="luckyCardsPlaceholder">
                            <!-- Lucky Cards Templates Placeholder -->
                        </div>  
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/bingo.js"></script>
</body>

</html>
