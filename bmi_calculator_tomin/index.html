<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My BMI Calculator (Tomin, Miller)</title>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
        integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-lg p-4 mx-auto" style="max-width: 400px;">
            <h2 class="text-center mb-3">
                <i class="fa-solid fa-weight-scale text-primary"></i> BMI Calculator
            </h2>

            <div class="mb-3">
                <label for="height" class="form-label">Height (cm)</label>
                <input type="number" id="height" class="form-control" placeholder="Enter your height in cm">
            </div>

            <div class="mb-3">
                <label for="weight" class="form-label">Weight (kg)</label>
                <input type="number" id="weight" class="form-control" placeholder="Enter your weight in kg">
            </div>

            <div class="d-grid">
                <button class="btn btn-primary" onclick="calculateBMI()">
                    <i class="fa-solid fa-calculator"></i> Calculate BMI
                </button>
            </div>

            <div class="mt-4 text-center">
                <h4 id="result" class="fw-bold"></h4>
                <p id="category" class="text-muted"></p>
            </div>
        </div>
    </div>

    <script src="scripts/bmi.js"></script>
</body>
</html>
